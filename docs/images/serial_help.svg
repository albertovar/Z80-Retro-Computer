<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Z80 monitor help output</title><desc id="desc">Help command output from the Z80 serial monitor.</desc>
<rect width="900" height="300" rx="12" fill="#111827"/><path d="M0 12a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v30H0z" fill="#263244"/>
<circle cx="24" cy="21" r="6" fill="#f87171"/><circle cx="46" cy="21" r="6" fill="#fbbf24"/><circle cx="68" cy="21" r="6" fill="#4ade80"/>
<text x="450" y="26" fill="#d1d5db" font-family="monospace" font-size="13" text-anchor="middle">Serial terminal — 115200 baud</text>
<g fill="#e5e7eb" font-family="monospace" font-size="19">
<text x="30" y="78">Z80&gt; help</text><text x="30" y="112">Commands:</text>
<text x="30" y="146">  help            - show this help</text>
<text x="30" y="180">  load AAAA       - load hex bytes into RAM</text>
<text x="30" y="214">  loadbin AAAA NNNN - receive NNNN binary bytes</text>
<text x="30" y="248">  dump AAAA BBBB  - dump memory range</text>
<text x="30" y="282">  go AAAA         - execute at address</text>
</g></svg>